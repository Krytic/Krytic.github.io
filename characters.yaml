pc_one:
    type: PC
    name: Aurora Everlast
    pronouns: she/her
    race: Aasimar
    class: Rogue 3 (Mastermind) / Bard 3 (Eloquence)
    bio: Relentless hopecore bard. She was thrust into being the face of the rebellion against the tyrannical Black Dragon Queen. She doesn't want to rule, but she refuses to accept the status quo, and always dreams of something different.
    # doc: https://docs.google.com/
    photo: "img/dnd/aurora_everlast.png"

npc_two:
    type: NPC
    name: Necromancer Bob
    pronouns: he/him
    race: Tiefling
    class: Wizard
    bio: His name wasn't Bob and he wasn't a necromancer. The players latched on to him graverobbing in the first session they met him, and the nickname stuck.